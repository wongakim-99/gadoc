name: ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm test:server

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Test deployment safety
        run: node --test scripts/test/deploy-ubuntu.test.mjs scripts/test/gadoc-storage-policy.test.mjs scripts/test/desktop-artifacts.test.mjs

      - name: Build backend
        run: pnpm build:server

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test document core
        run: pnpm test:document-core

      - name: Run frontend tests
        run: pnpm test:web

      - name: Build frontend
        run: pnpm build:web

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop
        run: pnpm --filter @slacord/desktop typecheck

      - name: Run desktop tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:desktop

      - name: Run desktop tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: pnpm test:desktop

      - name: Build desktop
        run: pnpm build:desktop

  web-e2e:
    needs:
      - backend
      - frontend
    # Playwright 1.58.2 does not support Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HOST: 127.0.0.1
      PORT: 8084
      JWT_SECRET: gadoc-ci-only-not-for-production-0123456789
      MONGODB_URI: mongodb://127.0.0.1:27017/slacord_ci
      INTERNAL_API_URL: http://127.0.0.1:8084
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3002/api
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3002
      NEXT_PUBLIC_SOCKET_URL: http://127.0.0.1:8084
      SLACORD_E2E_BASE_URL: http://127.0.0.1:3002
      SLACORD_E2E_API_URL: http://127.0.0.1:8084/api
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_PUBLIC_URL: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: slacord-ci
      MINIO_SECRET_KEY: slacord-ci-storage-only
      MINIO_BUCKET: slacord-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Restore test storage binary
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/slacord-minio
          key: minio-ubuntu24-x64-07c3a429bfed433e49018cb0f78a52145d4bedeb

      # Community MinIO images/binaries are no longer published. Build a pinned source revision.
      - name: Checkout test storage source
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: 07c3a429bfed433e49018cb0f78a52145d4bedeb
          path: .ci-minio-source
          persist-credentials: false

      - name: Setup Go for test storage
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: .ci-minio-source/go.sum

      - name: Build test storage
        if: steps.minio-cache.outputs.cache-hit != 'true'
        working-directory: .ci-minio-source
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/slacord-minio"
          go build -o "$RUNNER_TEMP/slacord-minio/minio" .

      - name: Start test object storage
        run: |
          MINIO_ROOT_USER="$MINIO_ACCESS_KEY" MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            "$RUNNER_TEMP/slacord-minio/minio" server "$RUNNER_TEMP/slacord-ci-objects" \
            --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 > /tmp/slacord-minio.log 2>&1 &
          echo $! > /tmp/slacord-minio.pid
          for _attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/slacord-minio.log
          exit 1

      - name: Build backend and frontend
        run: |
          pnpm build:server
          pnpm build:web

      - name: Test legacy attachment permission migration
        run: node --test scripts/test/legacy-file-bindings.integration.mjs

      - name: Start backend
        run: |
          pnpm start:server > /tmp/slacord-server.log 2>&1 &
          echo $! > /tmp/slacord-server.pid

      - name: Wait for backend
        run: |
          for _attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8084/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/slacord-server.log || true
          exit 1

      - name: Start frontend
        run: |
          pnpm start:web > /tmp/slacord-web.log 2>&1 &
          echo $! > /tmp/slacord-web.pid

      - name: Wait for frontend
        run: |
          for _attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3002 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/slacord-web.log || true
          exit 1

      - name: Run web e2e
        run: pnpm test:e2e:web

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: |
            playwright-report
            test-results
            /tmp/slacord-server.log
            /tmp/slacord-web.log
            /tmp/slacord-minio.log
          if-no-files-found: ignore

      - name: Stop frontend and backend
        if: always()
        run: |
          if [[ -f /tmp/slacord-web.pid ]]; then kill "$(cat /tmp/slacord-web.pid)" || true; fi
          if [[ -f /tmp/slacord-server.pid ]]; then kill "$(cat /tmp/slacord-server.pid)" || true; fi
          if [[ -f /tmp/slacord-minio.pid ]]; then kill "$(cat /tmp/slacord-minio.pid)" || true; fi
