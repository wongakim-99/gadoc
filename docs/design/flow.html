<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Slacord · 통합 UX 검토</title>
    <link rel="stylesheet" href="flow.css" />
  </head>
  <body>
    <header class="review">
      <b>통합 UX 검토 · v2</b
      ><span>최종 디자인 아님 · 합성 데이터 · 새로고침하면 초기화</span
      ><a href="/preview.html">이전 색상 시안</a>
    </header>
    <div class="shell">
      <aside id="nav">
        <div class="brand">slacord <span>제품팀</span></div>
        <p class="nav-label">개인</p>
        <button data-route="mine">내 작업</button>
        <p class="nav-label">제품팀 공간</p>
        <button data-route="project">◈　온보딩 개선</button
        ><button data-route="chat">#　제품 논의</button>
        <p class="nav-label">함께 관리하는 자료</p>
        <button data-route="meetings">▤　회의록</button
        ><button data-route="tasks">☑　업무 데이터베이스</button
        ><button data-route="decisions">◇　결정 기록</button
        ><button data-route="library">▧　자료실</button>
        <div class="nav-bottom">
          <p>확인할 흐름</p>
          <ol>
            <li>회의록에서 회의 열기</li>
            <li>시작 → 종료 → 작업 만들기</li>
            <li>업무에서 작업 완료하기</li>
            <li>프로젝트 집계 확인하기</li>
          </ol>
        </div>
      </aside>
      <main>
        <header class="location">
          <button
            id="menu"
            aria-label="탐색 메뉴 열기"
            aria-expanded="false"
            aria-controls="nav"
          >
            ☰</button
          ><span>제품팀</span><span>/</span><b id="location"></b
          ><span class="memory">검토용 임시 상태</span>
        </header>
        <div id="content" tabindex="-1"></div>
      </main>
    </div>
    <div id="overlay" hidden></div>
    <div id="toast" role="status" hidden></div>
    <script src="flow.js"></script>
  </body>
</html>
