name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tag and signing mode
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]]
          test -s "docs/releases/$GITHUB_REF_NAME.md"
          node scripts/check-desktop-release-secrets.mjs --allow-unsigned --require-mac-notarized

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: pnpm --filter @slacord/desktop dist:dmg --config.forceCodeSigning=true --config.dmg.sign=true
          - os: windows-2022
            command: pnpm --filter @slacord/desktop dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:desktop
      - name: Build installers without publishing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then unset "$key"; fi
          done
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          else
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            if [[ -n "${APPLE_API_KEY:-}" ]]; then
              node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/gadoc-notary-key.p8", Buffer.from(process.env.APPLE_API_KEY, "base64"), {mode: 0o600})'
              export APPLE_API_KEY="$RUNNER_TEMP/gadoc-notary-key.p8"
            fi
          fi
          ${{ matrix.command }}
          node scripts/verify-desktop-platform.mjs packages/desktop/release "$GITHUB_REF_NAME"
      - name: Remove temporary notarization key
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/gadoc-notary-key.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest*.yml
            packages/desktop/release/verification-*.json

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release
      - name: Verify complete release and generate checksums
        run: node scripts/verify-desktop-artifacts.mjs release "$GITHUB_REF_NAME" --require-mac-notarized
      - name: Publish only after every target succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > /tmp/release-draft; then
            [[ "$(cat /tmp/release-draft)" == "true" ]] || { echo "An already-public release is immutable."; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "GaDoc $GITHUB_REF_NAME" --notes-file release/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --notes-file release/RELEASE_NOTES.md --draft=false --latest
