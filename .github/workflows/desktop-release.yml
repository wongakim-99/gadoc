name: desktop-apple-notary-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-apple-notary-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tag and signing mode
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          [[ "$(git rev-parse HEAD^)" == "d7ce30cc724c407ec5e76681cba583c8047ba459" ]]
          [[ "$(git diff --name-only HEAD^ HEAD)" == ".github/workflows/desktop-release.yml" ]]
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          [[ "$VERSION" == "1.1.2" ]]
          test -s "docs/releases/v$VERSION.md"
          node scripts/check-desktop-release-secrets.mjs --target=mac --require-mac-notarized

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: pnpm --filter @slacord/desktop dist:dmg --config.forceCodeSigning=true --config.dmg.sign=true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:desktop
      - name: Build installers without publishing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!key}" ]]; then unset "$key"; fi
          done
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/gadoc-notary-key.p8", Buffer.from(process.env.APPLE_API_KEY, "base64"), {mode: 0o600})'
            export APPLE_API_KEY="$RUNNER_TEMP/gadoc-notary-key.p8"
          fi
          ${{ matrix.command }}
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          node scripts/verify-desktop-platform.mjs packages/desktop/release "v$VERSION"
      - name: Remove temporary notarization key
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/gadoc-notary-key.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest*.yml
            packages/desktop/release/verification-*.json
