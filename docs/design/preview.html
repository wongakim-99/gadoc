<style>

*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.65 'Segoe UI','Malgun Gothic',sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button,a,select{touch-action:manipulation}button{border:0;background:transparent}button:hover{background:var(--soft)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:var(--accent)}.study{min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 22px;border-bottom:1px solid var(--line);font-size:12px;background:var(--canvas)}.study strong{letter-spacing:.1em;font-size:10px}.study label{display:flex;gap:12px;align-items:center}.study select{border:1px solid var(--line);background:var(--canvas);border-radius:5px;padding:3px 8px}.muted{color:var(--muted)}.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:calc(100dvh - 42px);min-height:650px}.sidebar{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 23px;font-size:17px;font-weight:700;letter-spacing:-.5px}.mark{height:29px;width:29px;background:var(--ink);color:var(--canvas);display:grid;place-items:center;border-radius:8px;font-size:18px}.workspace{padding:0 10px 18px;display:flex;align-items:center;justify-content:space-between}.workspace b{font-size:13px}.workspace small{display:block;font-size:11px;color:var(--muted)}.row{width:100%;display:flex;align-items:center;gap:10px;text-align:left;min-height:36px;padding:6px 10px;border-radius:6px;margin:2px 0;font-size:13px}.row svg{width:17px;height:17px;color:var(--muted);flex-shrink:0}.row[aria-current=page]{background:var(--active);color:var(--accent);font-weight:600}.count{margin-left:auto;min-width:19px;padding:0 5px;border-radius:4px;background:var(--active);color:var(--accent);font-size:11px;text-align:center}.group{margin-top:25px}.group-label{font-size:11px;color:var(--muted);padding:0 10px 7px;display:flex;justify-content:space-between}.indent{padding-left:31px}.project-label{font-weight:600}.foot{margin-top:auto;padding-top:25px}.person{display:flex;align-items:center;gap:10px;padding:10px}.avatar{display:grid;place-items:center;width:32px;height:32px;flex-shrink:0;border-radius:50%;background:var(--soft);color:var(--muted);font-size:11px;font-weight:600}.avatar.blue{background:var(--active);color:var(--accent)}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px}.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}.location{height:58px;flex-shrink:0;padding:0 30px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.location .slash{color:var(--muted)}.location .right{margin-left:auto;display:flex;gap:12px;align-items:center}.button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-size:12px;white-space:nowrap}.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.primary:hover{filter:brightness(.96);background:var(--accent)}.tabs{display:flex;align-items:center;gap:25px;padding:0 30px;border-bottom:1px solid var(--line);height:46px;flex-shrink:0}.tabs button{font-size:13px;height:100%;padding:0 2px;border-bottom:2px solid transparent;color:var(--muted)}.tabs button[aria-current=page]{border-color:var(--accent);color:var(--ink);font-weight:600}.tabs .meta{margin-left:auto;font-size:11px;color:var(--muted)}.content{flex:1;overflow:auto;position:relative}.page{max-width:1050px;margin:auto;padding:36px 42px 50px}.eyebrow{font-size:11px;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}.page h1{font-size:28px;letter-spacing:-1px;margin:5px 0 6px;font-weight:650}.page h2{font-size:15px;font-weight:600;margin:26px 0 12px}.page p{margin:8px 0}.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:27px}.summary{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;margin:26px 0 30px}.summary div{padding:18px 22px;border-right:1px solid var(--line)}.summary div:last-child{border:0}.summary strong{font-size:25px;display:block;font-weight:550}.summary span{color:var(--muted);font-size:12px}.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(220px,1fr);gap:36px}.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}.item strong{font-size:13px;font-weight:550;display:block}.item small{font-size:11px;color:var(--muted)}.item time{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}.tag{padding:2px 7px;border-radius:4px;background:var(--soft);font-size:11px;color:var(--muted);white-space:nowrap}.tag.blue{color:var(--accent);background:var(--active)}.note{background:var(--sidebar);border-left:2px solid var(--accent);padding:16px 18px;border-radius:0 6px 6px 0;margin:20px 0}.note strong{font-size:13px}.note p{font-size:12px;color:var(--muted)}.chat{max-width:960px;margin:auto;padding:25px 35px;display:flex;flex-direction:column;min-height:100%}.date{text-align:center;font-size:11px;color:var(--muted);margin:10px 0 28px;display:flex;align-items:center;gap:15px}.date:before,.date:after{content:'';height:1px;background:var(--line);flex:1}.message{display:flex;gap:13px;padding:12px 0}.message-body{flex:1;min-width:0}.message b{font-size:13px}.message time{font-size:11px;color:var(--muted);margin-left:10px}.message p{margin:5px 0 9px;line-height:1.85}.link-card{border:1px solid var(--line);border-radius:7px;padding:12px 15px;text-align:left;max-width:430px;width:100%;display:block}.link-card small{display:block;color:var(--muted);font-size:11px}.message-actions{display:flex;gap:8px;margin-top:8px}.message-actions button{color:var(--accent);font-size:12px;border-radius:4px;padding:4px 7px;background:var(--active)}.composer{margin-top:auto;padding-top:30px}.composer form{border:1px solid var(--line);border-radius:9px;padding:12px}.composer textarea{resize:vertical;min-height:50px;width:100%;border:0;background:transparent;outline-offset:0}.composer-footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.document{max-width:820px}.document h1{font-size:36px;line-height:1.3;margin:16px 0 25px}.properties{display:grid;grid-template-columns:100px 1fr;gap:12px;font-size:12px;padding-bottom:25px;border-bottom:1px solid var(--line)}.document h2{font-size:20px;margin-top:32px}.document p,.document li{line-height:1.9}.doc-link{width:100%;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;color:var(--accent)}.board{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:20px;margin-top:25px}.column{background:var(--sidebar);padding:12px;border-radius:8px}.column-title{display:flex;gap:8px;align-items:center;font-size:12px;margin:0 0 15px}.issue{display:block;width:100%;border:1px solid var(--line);background:var(--canvas);border-radius:7px;padding:15px;text-align:left;margin:10px 0}.issue small{font-size:10px;color:var(--muted)}.issue b{display:block;font-size:13px;margin:7px 0 16px;font-weight:550}.issue-footer{display:flex;align-items:center;justify-content:space-between}.issue-footer .avatar{width:23px;height:23px;font-size:9px}.panel-backdrop{position:fixed;inset:42px 0 0;background:#0a102a30;z-index:4;display:flex;justify-content:flex-end}.panel{width:min(440px,100%);height:100%;overflow:auto;background:var(--canvas);padding:26px;box-shadow:var(--shadow);animation:enter .16s ease-out}.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.panel h2{font-size:20px}.panel label{display:block;font-size:12px;margin:20px 0 6px}.panel input,.panel select{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px;background:var(--canvas)}.panel .primary{margin-top:24px}.close{padding:5px 10px;font-size:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 20px;background:var(--ink);color:var(--canvas);border-radius:8px;box-shadow:var(--shadow);z-index:8;font-size:12px;max-width:90%}.mobile-toggle{display:none}.empty{text-align:center;padding:80px 20px}.empty h2{font-size:22px}.search-results .item{padding:15px 7px}.mobile-close{display:none}svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}kbd{font:10px monospace;color:var(--muted);margin-left:auto;border:1px solid var(--line);border-radius:4px;padding:1px 4px}[hidden]{display:none!important}@keyframes enter{from{transform:translateX(12px);opacity:0}to{transform:none;opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}@media(max-width:1100px){.page{padding:28px}.split{grid-template-columns:1fr}.location{padding:0 24px}.board{overflow:auto}.tabs .meta{display:none}}@media(max-width:760px){.study{padding:7px 12px;min-height:64px;gap:8px}.study .study-detail{display:none}.study label{gap:5px;font-size:11px}.app{height:calc(100dvh - 64px);min-height:0;grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;inset:64px 0 0;width:min(300px,90vw);z-index:6;box-shadow:0 0 0 100vmax #0a102a55}.mobile-close,.mobile-toggle{display:block}.mobile-close{margin-left:auto}.location{padding:0 14px;height:54px;gap:8px;font-size:12px}.location .right .muted{display:none}.tabs{padding:0 16px;gap:22px}.page{padding:25px 20px}.hero{align-items:flex-start}.hero .button{display:none}.page h1{font-size:24px}.summary div{padding:13px 12px}.summary strong{font-size:22px}.summary span{font-size:10px}.chat{padding:18px}.document h1{font-size:29px}.board{grid-template-columns:repeat(3,240px)}.panel-backdrop{top:64px}.item time{display:none}.brand{padding-bottom:18px}.split{gap:12px}.study strong{font-size:9px}}
</style></head>
<body>
<div class="study"><div><strong>SLACORD / DESIGN STUDY 01</strong> <span class="muted study-detail">　클릭 가능한 방향성 시안 · 샘플 데이터 · 서버 저장 없음</span></div><label>색상 비교 <select id="theme" aria-label="색상 방향"><option value="light">01 · Cloud Blue</option><option value="dark">02 · Slate Dark</option><option value="teal">03 · Quiet Teal</option></select></label></div>
<div class="app">
<aside class="sidebar" id="sidebar" aria-label="워크스페이스 탐색">
<div class="brand"><span class="mark">s</span> slacord<button class="mobile-close close" aria-label="메뉴 닫기">×</button></div>
<div class="workspace"><div><b>제품 개발팀</b><small>팀 워크스페이스</small></div><span class="tag">DEMO</span></div>
<button class="row" data-action="search"><span data-icon="search"></span>전체 검색<kbd>Ctrl K</kbd></button>
<button class="row" data-view="inbox"><span data-icon="inbox"></span>받은함<span class="count">3</span></button>
<button class="row" data-view="mine"><span data-icon="check"></span>내 작업</button>
<div class="group"><div class="group-label">즐겨찾기</div><button class="row" data-view="docs"><span data-icon="file"></span>출시 가이드</button><button class="row" data-view="chat"><span data-icon="hash"></span>제품 디자인</button></div>
<div class="group"><div class="group-label">팀 공간 <span>01</span></div><button class="row project-label" data-view="overview"><span data-icon="grid"></span>제품 개발 <span style="margin-left:auto">⌄</span></button><button class="row indent" data-view="chat">#　제품 디자인 <span class="count">2</span></button><button class="row indent" data-view="docs"><span data-icon="file"></span>출시 가이드</button><button class="row indent" data-view="issues"><span data-icon="check"></span>출시 준비</button></div>
<div class="group"><div class="group-label">워크스페이스</div><button class="row" data-view="announcements"><span data-icon="bell"></span>팀 공지</button><button class="row" data-action="huddle"><span data-icon="headphones"></span>팀 라운지<span class="muted" style="margin-left:auto;font-size:11px">2명</span></button></div>
<div class="foot"><button class="row" data-action="settings"><span data-icon="settings"></span>설정 및 멤버</button><div class="person"><span class="avatar blue">나</span><div style="font-size:12px"><b>내 워크스페이스</b><div class="muted"><span class="dot"></span>온라인 · 샘플 계정</div></div></div></div>
</aside>
<main class="main"><header class="location"><button class="mobile-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="sidebar"><span data-icon="menu"></span></button><span class="muted">제품 개발팀</span><span class="slash">/</span><b id="location">제품 개발</b><div class="right"><span class="muted" style="font-size:11px">팀 공개</span><button class="button" data-action="huddle">허들 시작</button></div></header>
<nav class="tabs" aria-label="공간 보기"><button data-view="overview">개요</button><button data-view="chat">대화</button><button data-view="docs">문서</button><button data-view="issues">이슈</button><span class="meta">같은 업무를, 같은 공간에서</span></nav>
<div class="content" id="content" tabindex="-1"></div></main></div>
<div id="overlay" hidden></div><div id="toast" class="toast" role="status" hidden></div>
<script>
const icons={search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',inbox:'<path d="M4 4h16v16H4zM4 13h5l2 3h2l2-3h5"/>',check:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8 12 3 3 5-6"/>',file:'<path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/>',hash:'<path d="m9 3-2 18M17 3l-2 18M4 9h17M3 16h17"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',bell:'<path d="M5 17h14l-2-4V9a5 5 0 0 0-10 0v4zM10 21h4"/>',headphones:'<path d="M4 14v-3a8 8 0 0 1 16 0v3M4 12h3v8H4zM17 12h3v8h-3z"/>',settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>'};
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[el.dataset.icon]+'</svg>');
const content=document.querySelector('#content'),overlay=document.querySelector('#overlay');let current='overview',previousFocus=null,toastTimer;const addedIssues=[],messages=[];const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const item=(title,desc,view,letter='↗')=>`<button class="item" data-view="${view}"><span class="avatar">${letter}</span><span><strong>${title}</strong><small>${desc}</small></span><time>열기 ↗</time></button>`;
const issue=(id,title,status='진행 중')=>`<button class="issue" data-action="issue-detail" data-title="${esc(title)}"><small>${id}</small><b>${esc(title)}</b><div class="issue-footer"><span class="tag">${status}</span><span class="avatar blue">지</span></div></button>`;
function view(name){current=name;closePanel(false);closeMenu();document.querySelectorAll('[data-view]').forEach(el=>{if(el.dataset.view===name)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});document.querySelector('#location').textContent=({inbox:'받은함',mine:'내 작업',announcements:'팀 공지'})[name]||'제품 개발';
const overview=`<div class="page"><div class="hero"><div><div class="eyebrow">Product workspace</div><h1>함께 만드는 다음 버전</h1><p class="muted">논의부터 결정, 실행까지 이어지는 제품 개발 공간입니다.</p></div><button class="button" data-view="docs">출시 가이드 ↗</button></div><div class="summary"><div><strong>08</strong><span>진행 중인 이슈</span></div><div><strong>03</strong><span>확인이 필요한 소식</span></div><div><strong>10.30</strong><span>다음 출시 예정</span></div></div><div class="split"><section><h2>지금 이어서 할 일</h2>${item('문서 탐색 개선안 검토','제품 디자인 · 새 답글 2개','chat','소')}${item('출시 가이드 업데이트','최근 열어본 문서 · 15분 전','docs','▤')}${item('모바일 메뉴 접근성 확인','SC-128 · 나에게 배정됨','issues','✓')}<h2>공간의 기준 문서</h2>${item('출시 가이드','결정 사항 · 일정 · 체크리스트','docs','▤')}</section><section><h2>이번 주의 결정</h2><div class="note"><strong>대화의 맥락을 문서와 연결합니다</strong><p>링크를 찾아 헤매지 않도록 관련 문서와 이슈를 같은 공간에서 확인할 수 있게 합니다.</p><button class="button" data-view="chat">논의 보기 →</button></div><h2>함께 작업 중</h2><div class="person"><span class="avatar blue">지</span><div>지민 <span class="muted">· 출시 가이드 작성 중</span></div></div><div class="person"><span class="avatar">소</span><div>소연 <span class="muted">· 제품 디자인</span></div><span class="dot"></span></div></section></div></div>`;
const chat=`<div class="chat"><div class="eyebrow"># 제품 디자인</div><div class="date">10월 26일 월요일</div><div class="message"><span class="avatar blue">소</span><div class="message-body"><b>소연</b><time>오전 10:24</time><p>문서를 읽다가 관련 대화를 바로 확인할 수 있으면 좋겠어요.<br>새 탐색 구조는 출시 가이드에 정리해 두었습니다.</p><button class="link-card" data-view="docs"><small>문서 · 제품 개발</small><strong>▤ 출시 가이드</strong><small>결정 사항과 작업 항목을 한곳에서 확인합니다.</small></button></div></div><div class="message"><span class="avatar">지</span><div class="message-body"><b>지민</b><time>오전 10:28</time><p>좋아요. 모바일에서는 문서와 대화를 겹쳐 놓기보다<br>뒤로 돌아왔을 때 읽던 위치를 유지하면 좋겠습니다.</p><div class="message-actions"><button data-action="thread">답글 2개</button><button data-action="create-issue">이 대화로 이슈 만들기</button></div></div></div><div id="sent-messages">${messages.map(m=>`<div class="message"><span class="avatar blue">나</span><div><b>나</b><p>${esc(m)}</p></div></div>`).join('')}</div><div class="composer"><form id="message-form"><label class="muted" for="message" style="font-size:11px">제품 디자인에 메시지 보내기 · 시안 내에서만 유지</label><textarea id="message" placeholder="팀과 이야기해 보세요" required maxlength="2000"></textarea><div class="composer-footer"><span>대화 → 결정 → 실행</span><button class="button primary" type="submit">보내기 ↑</button></div></form></div></div>`;
const docs=`<article class="page document"><div class="eyebrow">제품 개발 / 팀 문서</div><h1>출시 가이드</h1><div class="properties"><span class="muted">담당자</span><span>지민</span><span class="muted">문서 상태</span><span><span class="tag blue">검토 중</span></span><span class="muted">연결된 대화</span><span><button data-view="chat" style="color:var(--accent)"># 제품 디자인 ↗</button></span></div><h2>하나의 흐름으로 일하기</h2><p>팀의 대화는 빠르게 흘러가지만, 결정은 오래 남아야 합니다. 이번 출시에서는 대화와 문서, 실행할 일을 자연스럽게 연결합니다.</p><div class="note"><strong>이번 출시의 목표</strong><p>새로운 팀원이 설명을 듣지 않아도 지금 진행 중인 일과 결정의 배경을 찾을 수 있게 합니다.</p></div><h2>확인할 사항</h2><ul><li>어느 화면에서도 같은 위치에서 탐색할 수 있어야 합니다.</li><li>문서의 하위 페이지와 관련 대화를 함께 찾을 수 있어야 합니다.</li><li>모바일에서도 작성 중인 내용을 잃지 않아야 합니다.</li></ul><h2>하위 문서</h2><button class="doc-link" data-action="subpage">▤　모바일 탐색 원칙 <span style="float:right">↗</span></button><h2>연결된 작업</h2>${item('SC-128 · 모바일 메뉴 접근성 확인','진행 중 · 지민','issues','✓')}<p class="muted" style="font-size:11px;margin-top:28px">문서 속성과 연결 기능을 검토하는 시안입니다. 실제 편집기는 기존 서비스에서 사용할 수 있습니다.</p></article>`;
const issues=`<div class="page" style="max-width:1200px"><div class="hero"><div><div class="eyebrow">Project / Release</div><h1>출시 준비</h1><p class="muted">팀의 결정을 실행 가능한 작업으로 이어갑니다.</p></div><button class="button primary" data-action="create-issue">＋ 이슈 만들기</button></div><div class="board"><section class="column"><div class="column-title">○　할 일 <span class="count">${2+addedIssues.length}</span></div>${issue('SC-131','빈 화면 안내 문구 정리','할 일')}${issue('SC-132','문서 접근 권한 안내','할 일')}${addedIssues.map((v,i)=>issue('SC-'+(133+i),v,'할 일')).join('')}</section><section class="column"><div class="column-title">◐　진행 중 <span class="count">2</span></div>${issue('SC-128','모바일 메뉴 접근성 확인')}${issue('SC-129','문서와 대화 연결하기')}</section><section class="column"><div class="column-title">✓　완료 <span class="count">1</span></div>${issue('SC-127','문서 자동 저장 연결','완료')}</section></div></div>`;
const inbox=`<div class="page"><div class="eyebrow">Personal / Inbox</div><h1>내 확인이 필요한 소식</h1><p class="muted">멘션과 담당 작업을 한곳에서 확인합니다.</p><h2>아직 확인하지 않음 · 3</h2>${item('소연님이 대화에서 나를 언급했습니다','제품 디자인 · 5분 전','chat','소')}${item('모바일 메뉴 접근성 확인이 배정되었습니다','SC-128 · 18분 전','issues','✓')}${item('출시 가이드의 검토를 요청했습니다','팀 문서 · 30분 전','docs','▤')}</div>`;
const mine=`<div class="page"><div class="eyebrow">Personal / My work</div><h1>내 작업</h1><p class="muted">오늘 이어서 할 일과 최근 문서를 모았습니다.</p><h2>진행 중</h2>${item('SC-128 · 모바일 메뉴 접근성 확인','제품 개발 · 담당자: 나','issues','✓')}<h2>최근 열어본 문서</h2>${item('출시 가이드','15분 전','docs','▤')}</div>`;
const announcements=`<div class="page document"><div class="eyebrow">Workspace / Updates</div><h1>팀 공지</h1><div class="note"><strong>10월 30일 제품 업데이트 안내</strong><p>이번 주에는 문서 탐색과 협업 흐름을 점검합니다. 변경 사항과 확인할 작업은 출시 가이드에서 확인해 주세요.</p><button class="button" data-view="docs">출시 가이드 열기 →</button></div></div>`;
content.innerHTML=({overview,chat,docs,issues,inbox,mine,announcements})[name]||overview;content.scrollTop=0;}
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4500)}
function closePanel(restore=true){if(overlay.hidden)return;overlay.hidden=true;overlay.innerHTML='';if(restore&&previousFocus?.isConnected)previousFocus.focus()}
function panel(title,body){previousFocus=document.activeElement;overlay.hidden=false;overlay.className='panel-backdrop';overlay.innerHTML=`<section class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"><header><b id="panel-title">${title}</b><button class="close" data-action="close" aria-label="패널 닫기">×</button></header>${body}</section>`;overlay.querySelector('input,button').focus()}
function action(name,el){if(name==='close')return closePanel();if(name==='search'){panel('워크스페이스 검색','<label for="query">문서 · 대화 · 이슈 검색</label><input id="query" placeholder="출시, 모바일, 디자인…" autocomplete="off"><div class="search-results" id="results"></div>');search('');overlay.querySelector('input').focus()}else if(name==='create-issue'){panel('대화에서 이슈 만들기',`<p class="muted">논의의 원문을 유지하고 담당할 일을 만듭니다.</p><form id="issue-form"><label for="issue-title">제목</label><input id="issue-title" value="모바일 탐색 시 읽던 위치 유지" required maxlength="120"><label for="assignee">담당자</label><select id="assignee"><option>지민</option></select><div class="note"><strong>연결된 대화</strong><p># 제품 디자인 · 지민의 메시지</p></div><button class="button primary">시안에 이슈 추가</button></form>`)}else if(name==='issue-detail'){panel('이슈 상세',`<span class="tag blue">제품 개발</span><h2>${esc(el.dataset.title)}</h2><p class="muted">담당자 · 지민</p><h3>관련 맥락</h3>${item('출시 가이드','연결된 문서','docs','▤')}${item('제품 디자인','원본 대화','chat','#')}`)}else if(name==='thread'){panel('대화 · 답글 2개','<p><b>소연</b></p><p>좋아요. 모바일 화면에서도 이 흐름을 확인해 볼게요.</p><p><b>지민</b></p><p>후속 작업을 이슈로 남겨 두겠습니다.</p><button class="button primary" data-action="create-issue">이슈로 연결</button>')}else if(name==='subpage'){panel('하위 문서 · 모바일 탐색 원칙','<div class="eyebrow">출시 가이드 / 모바일 탐색 원칙</div><h2>읽던 위치로 돌아오기</h2><p>작은 화면에서는 관련 문서를 전체 화면으로 열고, 뒤로 이동하면 원래 대화의 위치를 복원합니다.</p><button class="button" data-view="docs">부모 문서로 돌아가기</button>')}else if(name==='huddle'){panel('팀 라운지','<span class="tag blue">음성 연결 UX 제안</span><h2>대화가 필요할 때, 가볍게</h2><p>참여자와 연결 상태를 보여주고, 화면을 이동해도 음소거와 나가기 제어를 유지합니다.</p><div class="person"><span class="avatar blue">지</span>지민<span class="dot"></span></div><div class="person"><span class="avatar">소</span>소연<span class="dot"></span></div><div class="note"><p>이 시안에서는 실제 마이크·카메라 연결을 시작하지 않습니다. 기존 소규모 허들 기능의 화면 개선 제안입니다.</p></div>')}else if(name==='settings'){panel('디자인 방향 설정','<h2>같은 구조, 세 가지 색상</h2><p>상단 색상 비교에서 라이트·다크·틸을 전환할 수 있습니다.</p><p>기능명과 탐색 위치는 테마에 관계없이 동일하게 유지합니다.</p><div class="note"><p>이 화면은 합성 데이터로 만든 디자인 검토용입니다. 계정과 서버 설정은 변경하지 않습니다.</p></div>')}}
function search(q){const entries=[['출시 가이드','문서 · 제품 개발','docs'],['제품 디자인','대화 · 팀 채널','chat'],['모바일 메뉴 접근성 확인','이슈 · SC-128','issues']];const found=entries.filter(e=>e.join(' ').includes(q));document.querySelector('#results').innerHTML=found.length?found.map(e=>item(...e)).join(''):'<p class="muted">일치하는 샘플 항목이 없습니다.</p>'}
function closeMenu(){document.querySelector('#sidebar').classList.remove('open');document.querySelector('.mobile-toggle').setAttribute('aria-expanded','false')}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){view(v.dataset.view);content.focus();return}const a=e.target.closest('[data-action]');if(a)action(a.dataset.action,a);if(e.target===overlay)closePanel()});
document.querySelector('#theme').addEventListener('change',e=>document.documentElement.dataset.theme=e.target.value);
document.querySelector('.mobile-toggle').onclick=()=>{document.querySelector('#sidebar').classList.add('open');document.querySelector('.mobile-toggle').setAttribute('aria-expanded','true');document.querySelector('.mobile-close').focus()};document.querySelector('.mobile-close').onclick=()=>{closeMenu();document.querySelector('.mobile-toggle').focus()};
document.addEventListener('input',e=>{if(e.target.id==='query')search(e.target.value)});
document.addEventListener('submit',e=>{if(e.target.id==='issue-form'){e.preventDefault();const title=document.querySelector('#issue-title').value.trim();if(!title)return;addedIssues.push(title);closePanel();view('issues');toast('시안에 이슈를 추가했습니다. 서버에는 저장되지 않습니다.')}if(e.target.id==='message-form'){e.preventDefault();const value=document.querySelector('#message').value.trim();if(!value)return;messages.push(value);view('chat');content.scrollTop=content.scrollHeight;document.querySelector('#message').focus()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();action('search')}if(e.key==='Escape'){closePanel();closeMenu()}if(e.key==='Tab'){const scope=!overlay.hidden?overlay:document.querySelector('#sidebar.open');if(!scope)return;const all=[...scope.querySelectorAll('button,input,select,a[href]')].filter(x=>x.getClientRects().length);if(!all.length)return;const first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
view('overview');
</script></body></html>
