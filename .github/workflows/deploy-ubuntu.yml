name: deploy-ubuntu

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Check connection, build without activation, or deploy the verified main commit
        type: choice
        options: [check, prepare, deploy]
        default: check

permissions:
  contents: read
  actions: read

concurrency:
  group: slacord-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: production
      url: https://gadoc.kr
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_HOST: ${{ secrets.SLACORD_SSH_HOST }}
      DEPLOY_PORT: ${{ secrets.SLACORD_SSH_PORT }}
      DEPLOY_USER: ${{ secrets.SLACORD_SSH_USER }}
    steps:
      - name: Select current main revision
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_MODE: ${{ inputs.mode }}
          PREPARE_ONLY_SHA: ${{ vars.SLACORD_PREPARE_ONLY_SHA }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$EVENT_NAME" == workflow_run && "$sha" != "$VERIFIED_SHA" ]]; then
            echo 'A newer main revision exists; skipping this obsolete deployment.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mode=${REQUESTED_MODE:-deploy}
          if [[ "$mode" == deploy && "$sha" == "$PREPARE_ONLY_SHA" ]]; then mode=prepare; fi
          if [[ "$mode" != check ]]; then
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$sha&per_page=1" --jq '.workflow_runs[0].conclusion')
            [[ "$conclusion" == success ]] || { echo 'The current main commit has not passed CI.'; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Checkout verified revision
        if: steps.release.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Configure pinned SSH connection
        if: steps.release.outputs.skip != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SLACORD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SLACORD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing SLACORD_SSH_HOST}"
          : "${DEPLOY_PORT:?Missing SLACORD_SSH_PORT}"
          : "${DEPLOY_USER:?Missing SLACORD_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing SLACORD_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing SLACORD_SSH_KNOWN_HOSTS}"
          umask 077
          mkdir -p "$RUNNER_TEMP/slacord-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/slacord-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/slacord-ssh/known_hosts"

      - name: Check or deploy to ubuntu-gadoc
        if: steps.release.outputs.skip != 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
        run: |
          set -euo pipefail
          connection=(-T -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/slacord-ssh/key"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/slacord-ssh/known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=120)
          ssh "${connection[@]}" "$DEPLOY_USER@$DEPLOY_HOST" check
          if [[ "$RELEASE_MODE" != check ]]; then
            # Recheck after checkout/queueing so a superseded commit cannot be promoted.
            latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            [[ "$latest" == "$RELEASE_SHA" ]] || { echo 'main changed; skipping stale revision.'; exit 0; }
            git archive --format=tar.gz --output="$RUNNER_TEMP/slacord-source.tar.gz" "$RELEASE_SHA"
            digest=$(sha256sum "$RUNNER_TEMP/slacord-source.tar.gz" | cut -d ' ' -f 1)
            # Expand the validated mode/SHA/checksum locally for the forced remote handler.
            # shellcheck disable=SC2029
            ssh "${connection[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "$RELEASE_MODE $RELEASE_SHA $digest" < "$RUNNER_TEMP/slacord-source.tar.gz"
          fi
          # Markdown backticks in the job summary are literal.
          # shellcheck disable=SC2016
          printf 'Mode: `%s`\n\nRevision: `%s`\n\nTarget: `ubuntu-gadoc` / https://gadoc.kr\n' \
            "$RELEASE_MODE" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/slacord-ssh"
