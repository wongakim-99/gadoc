packages:
  - packages/*

# Electron packaging needs a physical, hoisted dependency tree.
nodeLinker: hoisted
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@swc/core"
  - bcrypt
  - electron
  - esbuild
  - sharp
  - unrs-resolver

# Prebuilt watcher binaries are used; telemetry and unused Squirrel tooling are not run.
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@scarf/scarf"
  - electron-winstaller

overrides:
  multer: ^2.5.0
  "@blocknote/core>uuid": ^11.1.1
  "@nestjs/swagger>js-yaml": ^5.4.1
  "tsup>esbuild": ^0.28.1
